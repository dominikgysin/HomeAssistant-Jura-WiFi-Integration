[project]
name = "jura-wifi-ha"
version = "0.5.1"
description = "Home Assistant integration for JURA machines with a Wi-Fi Connect dongle"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["homeassistant", "custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
